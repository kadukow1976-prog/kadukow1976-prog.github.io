name: Android Companion - test APK
on:
  push:
    branches: [main]
    paths:
      - "android-companion/**"
      - ".github/workflows/android-companion.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        shell: bash
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -1)
          if [ -z "$SDKMANAGER" ]; then echo "Android sdkmanager not found"; exit 1; fi
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile debug APK
        working-directory: android-companion
        run: gradle --no-daemon :app:assembleDebug
      - name: Publish beta APK to GitHub Releases (first build only)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view android-hub-beta-0.2 >/dev/null 2>&1; then
            echo "Existing beta release preserved to avoid changing debug signing key."
            exit 0
          fi
          cp android-companion/app/build/outputs/apk/debug/app-debug.apk android-hub-beta-0.2.apk
          gh release create android-hub-beta-0.2 android-hub-beta-0.2.apk \
            --target "$GITHUB_SHA" \
            --title "Android Control Hub 0.2 Beta — TEST APK" \
            --prerelease \
            --notes "Тестовый выпуск 0.2: новый сервисный интерфейс, поиск приложений, ручные тесты оборудования, системные переходы и функции 0.1. Важное: подпись тестовой сборки отличается от предыдущего APK, поэтому перед установкой 0.2 может потребоваться удалить 0.1. Контакты передаются только при вашем подтверждении. Без удалённого скрытого управления; не финальный релиз для клиентов."
      - uses: actions/upload-artifact@v4
        with:
          name: android-control-hub-debug-apk
          path: android-companion/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
