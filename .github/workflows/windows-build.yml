name: Android Control Hub - Windows EXE
on:
  push:
    branches: [main]
    paths:
      - 'pc-control-hub/**'
      - '.github/workflows/windows-build.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unpack verified source
        shell: pwsh
        run: Expand-Archive -Path pc-control-hub/AndroidControlHub-Windows-Source.zip -DestinationPath pc-control-hub/build -Force
      - name: Upgrade original source with automatic ADB/Fastboot recovery
        shell: pwsh
        run: |
          python pc-control-hub/upgrade_0_2.py pc-control-hub/build
          Copy-Item pc-control-hub/test_bootstrap_0_2.py pc-control-hub/build/tests/test_bootstrap.py -Force
          Copy-Item pc-control-hub/README.md pc-control-hub/build/README.md -Force
      - name: Upgrade source with compact Russian UI and safe selected operations
        shell: pwsh
        run: |
          python pc-control-hub/upgrade_0_3.py pc-control-hub/build
          Copy-Item pc-control-hub/test_0_3.py pc-control-hub/build/tests/test_0_3.py -Force
      - name: Fix Android 16 cache timeouts and add safe settings fallback
        shell: pwsh
        run: |
          python pc-control-hub/upgrade_0_3_1.py pc-control-hub/build
          Copy-Item pc-control-hub/test_0_3_1.py pc-control-hub/build/tests/test_0_3_1.py -Force
      - name: Handle Android 16 data-clear permission denials safely
        shell: pwsh
        run: |
          python pc-control-hub/upgrade_0_3_2.py pc-control-hub/build
          Copy-Item pc-control-hub/test_0_3_2.py pc-control-hub/build/tests/test_0_3_2.py -Force
      - name: Build SamFw-style app selection and guard batch operation
        shell: pwsh
        run: |
          python pc-control-hub/upgrade_0_3_3.py pc-control-hub/build
          Copy-Item pc-control-hub/test_0_3_3.py pc-control-hub/build/tests/test_0_3_3.py -Force
      - name: Add transparent agent and privileges management
        shell: pwsh
        run: |
          Copy-Item pc-control-hub/access_center.py pc-control-hub/build/src/access_center.py -Force
          Copy-Item pc-control-hub/agent_updates.py pc-control-hub/build/src/agent_updates.py -Force
          python pc-control-hub/upgrade_0_3_4.py pc-control-hub/build
          Copy-Item pc-control-hub/test_0_3_4.py pc-control-hub/build/tests/test_0_3_4.py -Force
      - name: Verify authenticated agent release downloads and prevent downgrades
        shell: pwsh
        run: |
          python pc-control-hub/upgrade_0_3_5.py pc-control-hub/build
          Copy-Item pc-control-hub/test_0_3_5.py pc-control-hub/build/tests/test_0_3_5.py -Force
      - name: Retry Android 16 agent version check with safe read-only fallbacks
        shell: pwsh
        run: |
          python pc-control-hub/upgrade_0_3_6.py pc-control-hub/build
          Copy-Item pc-control-hub/test_0_3_6.py pc-control-hub/build/tests/test_0_3_6.py -Force
      - name: Keep privileges report consistent with agent updater on Android 16
        shell: pwsh
        run: |
          python pc-control-hub/upgrade_0_3_7.py pc-control-hub/build
          Copy-Item pc-control-hub/test_0_3_7.py pc-control-hub/build/tests/test_0_3_7.py -Force
      - name: Test actual installed state in active Android profile
        shell: pwsh
        run: |
          python pc-control-hub/upgrade_0_3_8.py pc-control-hub/build
          Copy-Item pc-control-hub/test_0_3_8.py pc-control-hub/build/tests/test_0_3_8.py -Force
      - name: Run backend unit tests
        working-directory: pc-control-hub/build
        shell: pwsh
        run: python -m unittest discover -s tests -v
      - name: Install pinned PyInstaller
        shell: pwsh
        run: python -m pip install pyinstaller==6.16.0
      - name: Build standalone Windows EXE
        working-directory: pc-control-hub/build
        shell: pwsh
        run: python -m PyInstaller --clean --onefile --windowed --name AndroidControlHub --paths src src/app.py
      - name: Package EXE and documentation
        shell: pwsh
        run: Compress-Archive -Path pc-control-hub/build/dist/AndroidControlHub.exe,pc-control-hub/build/README.md -DestinationPath AndroidControlHub-Windows-0.3.8.zip -Force
      - name: Package reproducible 0.3.8 source
        shell: pwsh
        run: |
          $folder = 'pc-control-hub/source-package'
          New-Item -ItemType Directory -Path $folder -Force | Out-Null
          Copy-Item pc-control-hub/build/src $folder -Recurse -Force
          Copy-Item pc-control-hub/build/tests $folder -Recurse -Force
          Copy-Item pc-control-hub/build/README.md $folder -Force
          Copy-Item pc-control-hub/build/start.cmd $folder -Force
          Compress-Archive -Path "$folder/*" -DestinationPath AndroidControlHub-Windows-0.3.8-Source.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: AndroidControlHub-Windows-EXE
          path: |
            AndroidControlHub-Windows-0.3.8.zip
            AndroidControlHub-Windows-0.3.8-Source.zip
          if-no-files-found: error
      - name: Publish Windows beta release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = 'android-control-hub-windows-0.3.8'
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            Write-Host 'Release exists; preserving original build.'
            exit 0
          }
          gh release create $tag AndroidControlHub-Windows-0.3.8.zip AndroidControlHub-Windows-0.3.8-Source.zip --target $env:GITHUB_SHA --title 'Android Control Hub Windows 0.3.8 Beta' --prerelease --notes 'Version 0.3.8: Distinguish agent installed in active Android profile from cached package metadata and disabled app. Detect active user, offer consented install-existing recovery, enable or launch exported WorkshopActivity. Never mistake cached versionCode9 for operational agent; no data clearing. Prior 0.3.7:  Fix inconsistent agent status in Privileges tab: reuse Android 16 version detection from updater, distinguish failed query from missing app and automatically refresh status after update check. No unnecessary reinstall or changes to device. Previous 0.3.6:  Repair adb exit code 1 when checking Android Control Hub Agent version on Android 16. Falls back from dumpsys package to read-only pm/cmd package list --show-versioncode. No silent installation/downgrade; unknown versions display ADB diagnostics. Existing SHA-256 APK verification preserved. Previous 0.3.5:  Download latest verified Android Control Hub agent from the published manifest. Detect installed versionCode, refuse downgrades and unknown version, verify exact SHA256 and byte count, require explicit owner consent, and report already-current agents without reinstalling. No forced downgrades or app data clearing. Prior 0.3.4:  New opt-in privileges diagnostic tab, ADB shell UID check, agent / Shizuku presence checks, manual APK agent installation, and official Device Owner and Shizuku docs. No silent privilege grant, system signature, device owner, or root. Previous 0.3.3: SamFw-style checkbox app multi-select, check-all-visible, independent per-package statuses and fail-fast behavior on Android 16 CLEAR_APP_USER_DATA refusal. Denied actions can be continued manually using Android Settings; no privilege bypass or false successes. Previously:  Android 16/OxygenOS CLEAR_APP_USER_DATA failures are detected and reported in Russian. A refused clear opens app settings for manual action; no automatic uninstall/bypass. Existing 0.3.1 cache-timeout improvements retained. Prior 0.3.1: Android 16 cache-only operation timeout is explicitly marked as UNKNOWN outcome, never mistaken for permissions denial or success. On single-app cache errors the device opens its stock app settings via safe ADB intent, and a manual Settings button is available. No full data clear fallback or unattended retry. Russian compact diagnostics and batch confirmation are retained. Tested with fake ADB in CI; device behavior should be verified on OnePlus. Unsigned beta.'