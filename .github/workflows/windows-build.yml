name: Android Control Hub - Windows EXE
on:
  push:
    branches: [main]
    paths:
      - 'pc-control-hub/**'
      - '.github/workflows/windows-build.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unpack verified source
        shell: pwsh
        run: Expand-Archive -Path pc-control-hub/AndroidControlHub-Windows-Source.zip -DestinationPath pc-control-hub/build -Force
      - name: Run backend unit tests
        working-directory: pc-control-hub/build
        shell: pwsh
        run: python -m unittest discover -s tests -v
      - name: Install pinned PyInstaller
        shell: pwsh
        run: python -m pip install pyinstaller==6.16.0
      - name: Build standalone Windows EXE
        working-directory: pc-control-hub/build
        shell: pwsh
        run: python -m PyInstaller --clean --onefile --windowed --name AndroidControlHub --paths src src/app.py
      - name: Package EXE and documentation
        shell: pwsh
        run: Compress-Archive -Path pc-control-hub/build/dist/AndroidControlHub.exe,pc-control-hub/build/README.md -DestinationPath AndroidControlHub-Windows-0.1.0.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: AndroidControlHub-Windows-EXE
          path: AndroidControlHub-Windows-0.1.0.zip
          if-no-files-found: error
      - name: Publish Windows beta release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = 'android-control-hub-windows-0.1.0'
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            Write-Host 'Release exists; preserving original build.'
            exit 0
          }
          gh release create $tag AndroidControlHub-Windows-0.1.0.zip --target $env:GITHUB_SHA --title 'Android Control Hub Windows 0.1.0 Beta' --prerelease --notes 'Real ADB-based Windows diagnostics and maintenance for owner-authorized phones. Includes app list, package actions, cache-only safety guard, APK install, file backup, Fastboot info and logs. Requires developer USB debugging authorized by the owner. Automated unit tests run in CI; physical-phone tests pending. Beta is unsigned and may trigger SmartScreen.'